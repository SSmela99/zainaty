[build.environment]
  # Cache Turbopacka nie jest publikowany, a i tak wkleja wartości zmiennych.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
  # Publiczne wartości, które celowo są w kodzie i HTML. Klucze API zostają pod skanem.
  SECRETS_SCAN_OMIT_KEYS = "R2_BUCKET_NAME,BREVO_FROM_EMAIL,BREVO_FROM_NAME,CONSULTATION_NOTIFY_EMAIL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,GOOGLE_CALENDAR_ID"
